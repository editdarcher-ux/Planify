name: Export Planify Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct original Planify source
        shell: bash
        run: |
          cat ci/project.part* > planify-project.b64
          base64 --decode planify-project.b64 > planify-project.tar.gz
          tar -xzf planify-project.tar.gz
          rm planify-project.b64 planify-project.tar.gz

      - name: Apply Planify 1.1.0 patch
        shell: bash
        run: |
          cat ci/v110.patch.part* > planify-v110-patch.b64
          base64 --decode planify-v110-patch.b64 > planify-v110-patch.tar.gz
          tar -xzf planify-v110-patch.tar.gz
          rm planify-v110-patch.b64 planify-v110-patch.tar.gz

      - name: Apply Planify 1.2.0 patch
        shell: bash
        run: |
          cat ci/v120s.part00 ci/v120s.part01 ci/v120s.part02 ci/v120s.part03 ci/v120s.part04 ci/v120s.part05 ci/v120s.part06 > planify-v120.b64
          base64 --decode planify-v120.b64 > planify-v120.tar.gz
          tar -xzf planify-v120.tar.gz
          rm planify-v120.b64 planify-v120.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/planify/app/ui/screens/CalendarScreen.kt')
          s = p.read_text()
          s = s.replace('''                        onPrev = {\n                            month = month.minusMonths(1)\n                            selected = month.minusMonths(1).atDay(1)\n                        },\n                        onNext = {\n                            month = month.plusMonths(1)\n                            selected = month.plusMonths(1).atDay(1)\n                        },''','''                        onPrev = {\n                            val target = month.minusMonths(1)\n                            month = target\n                            selected = target.atDay(1)\n                        },\n                        onNext = {\n                            val target = month.plusMonths(1)\n                            month = target\n                            selected = target.atDay(1)\n                        },''')
          p.write_text(s)
          PY

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: Planify-1.2.0-source
          path: |
            app/
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
          if-no-files-found: error
