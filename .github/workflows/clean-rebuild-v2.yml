name: Build clean Planify stable

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'clean-app/**'
      - '.github/workflows/clean-rebuild-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build APK
        working-directory: clean-app
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Validate APK
        working-directory: clean-app
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Planify-1.5.0-clean-apk
          path: clean-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Record run id
        if: always()
        shell: bash
        run: |
          mkdir -p ci
          printf '%s\n' '${{ github.run_id }}' > ci/latest-clean-run.txt
          printf '%s\n' '${{ job.status }}' > ci/latest-clean-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/latest-clean-run.txt ci/latest-clean-status.txt
          git commit -m 'Record latest clean Planify build run' || exit 0
          git push
