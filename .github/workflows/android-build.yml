name: Build Planify Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct uploaded Planify project
        shell: bash
        run: |
          cat ci/current.part00 ci/current.part01 ci/current.part02 ci/current.part03 ci/current.part04 > planify-current.b64
          base64 --decode planify-current.b64 > planify-current.tar.gz
          echo "0988fea50beb4376d658114f9780a227bcc9da6ec5be0fa6e652abd6b063700e  planify-current.tar.gz" | sha256sum -c -
          tar -xzf planify-current.tar.gz
          rm planify-current.b64 planify-current.tar.gz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload Planify APK
        uses: actions/upload-artifact@v4
        with:
          name: Planify-current-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
