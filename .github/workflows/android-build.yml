name: Build Planify Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Planify source
        shell: bash
        run: |
          cat ci/project.part* > planify-project.b64
          base64 --decode planify-project.b64 > planify-project.tar.gz
          tar -xzf planify-project.tar.gz
          rm planify-project.b64 planify-project.tar.gz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Planify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Planify-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
