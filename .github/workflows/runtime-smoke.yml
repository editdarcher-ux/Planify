name: Runtime smoke Android 15

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'clean-app/**'
      - '.github/workflows/runtime-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Record run id at start
        shell: bash
        run: |
          mkdir -p ci
          printf '%s\n' '${{ github.run_id }}' > ci/latest-runtime-smoke-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/latest-runtime-smoke-run.txt
          git commit -m 'Record Android 15 runtime smoke run id' || true
          git push || (git pull --rebase origin main && git push)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build APK
        working-directory: clean-app
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Android 15 runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            APK="clean-app/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.planify.app || true
            adb shell monkey -p com.planify.app -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 3

            cat > /tmp/tap_text.py <<'PY'
            import re, subprocess, sys, xml.etree.ElementTree as ET
            text=sys.argv[1]
            subprocess.run(['adb','shell','uiautomator','dump','/sdcard/window.xml'], check=True, stdout=subprocess.DEVNULL)
            subprocess.run(['adb','pull','/sdcard/window.xml','/tmp/window.xml'], check=True, stdout=subprocess.DEVNULL)
            root=ET.parse('/tmp/window.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text') == text or n.attrib.get('content-desc') == text:
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                    if m:
                        x=(int(m.group(1))+int(m.group(3)))//2
                        y=(int(m.group(2))+int(m.group(4)))//2
                        subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
                        print(f'tapped {text} at {x},{y}')
                        sys.exit(0)
            print(f'NOT FOUND: {text}')
            sys.exit(2)
            PY

            python3 /tmp/tap_text.py '＋'
            sleep 1
            python3 /tmp/tap_text.py 'Clase'
            sleep 2

            if ! adb shell pidof com.planify.app >/dev/null; then
              echo 'APP DIED AFTER OPENING EDITOR'
              adb logcat -d -v threadtime '*:E'
              exit 20
            fi

            adb shell uiautomator dump /sdcard/editor.xml >/dev/null
            adb pull /sdcard/editor.xml /tmp/editor.xml >/dev/null
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root=ET.parse('/tmp/editor.xml').getroot()
            edits=[n for n in root.iter('node') if n.attrib.get('class')=='android.widget.EditText']
            if not edits:
                raise SystemExit('No EditText found')
            n=edits[0]
            m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
            x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2
            subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
            subprocess.run(['adb','shell','input','text','PruebaPlanify'],check=True)
            PY
            adb shell input keyevent 4
            sleep 1
            python3 /tmp/tap_text.py 'Guardar'
            sleep 3

            echo '--- PROCESS ---'
            adb shell pidof com.planify.app || true
            echo '--- FATAL/CRASH LOGS ---'
            adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com\.planify\.app|am_crash|com\.planify\.app' | tail -n 250 || true

            if ! adb shell pidof com.planify.app >/dev/null; then
              exit 21
            fi

            echo 'Runtime smoke passed'

      - name: Record smoke status
        if: always()
        shell: bash
        run: |
          git pull --rebase origin main || true
          mkdir -p ci
          printf '%s\n' '${{ job.status }}' > ci/latest-runtime-smoke-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/latest-runtime-smoke-status.txt
          git commit -m 'Record latest Android 15 runtime smoke status' || exit 0
          git push || (git pull --rebase origin main && git push)
